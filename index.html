    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob: mediastream:; connect-src * https: http: wss: ws:; img-src * data: blob: https: http:; media-src * data: blob: mediastream:; font-src * data: https:;">
    <script>
      // Gracefully handle Vite HMR WebSocket in sandbox and suppress benign dev notices
      (function() {
        const OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('@vite')))) {
              const stub = new EventTarget();
              stub.readyState = 1;
              stub.url = url;
              stub.protocol = 'vite-hmr';
              stub.extensions = '';
              stub.bufferedAmount = 0;
              stub.binaryType = 'blob';
              stub.send = function() {};
              stub.close = function() {};
              stub.addEventListener = EventTarget.prototype.addEventListener.bind(stub);
              stub.removeEventListener = EventTarget.prototype.removeEventListener.bind(stub);
              stub.dispatchEvent = EventTarget.prototype.dispatchEvent.bind(stub);
              setTimeout(() => {
                stub.dispatchEvent(new Event('open'));
              }, 0);
              return stub;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        const isBenignDevNotice = function(msg) {
          if (!msg) return false;
          const str = typeof msg === 'string' ? msg : (msg.message || msg.stack || String(msg));
          return str.includes('WebSocket') || 
                 str.includes('websocket') || 
                 str.includes('Cloud Firestore backend') || 
                 str.includes('offline mode') ||
                 str.includes('the client is offline');
        };

        const origError = console.error;
        console.error = function(...args) {
          if (args.some(isBenignDevNotice)) {
            console.debug('[Dev Notice]', ...args);
            return;
          }
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(isBenignDevNotice)) {
            console.debug('[Dev Notice]', ...args);
            return;
          }
          origWarn.apply(console, args);
        };

        const origOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (isBenignDevNotice(msg) || isBenignDevNotice(error)) {
            return true;
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          if (isBenignDevNotice(event.message) || isBenignDevNotice(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isBenignDevNotice(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
